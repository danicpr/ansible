---
- hosts: localhost
  become: true
  vars_prompt:
    - name: bw_password
      prompt: "Clave maestra de Bitwarden"
      private: true

  tasks:
    - name: Desbloquear vault y obtener sesión de Bitwarden
      command: bw unlock --passwordenv BW_PASSWORD --raw
      environment:
        BW_PASSWORD: "{{ bw_password }}"
      register: bw_unlock
      no_log: true
      become: false

    - name: Guardar BW_SESSION como fact
      set_fact:
        bw_session: "{{ bw_unlock.stdout }}"
      no_log: true

    - name: Sincronizar vault
      command: bw sync
      become: false
      environment:
        BW_SESSION: "{{ bw_session }}"

  roles:
    - packages
    - dev_tools
    - fonts
    - theme
    - extensions
    - chezmoi
