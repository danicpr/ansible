---
- hosts: localhost
  become: true
  vars:
    desktop_user: "{{ lookup('env', 'SUDO_USER') | default(lookup('env', 'USER'), true) }}"
    desktop_home: "{{ lookup('env', 'HOME') }}"
  vars_prompt:
    - name: bw_password
      prompt: "Clave maestra de Bitwarden"
      private: true

  pre_tasks:
    - name: Validar usuario y home de escritorio
      become: false
      assert:
        that:
          - desktop_user | length > 0
          - desktop_home | length > 0
          - desktop_user != 'root'
          - desktop_home != '/root'
        fail_msg: "El playbook debe ejecutarse como el usuario de escritorio, no como root"

    - name: Comprobar instalación de Bitwarden CLI
      command: bw --version
      become: false
      changed_when: false

    - name: Comprobar autenticación de Bitwarden
      command: bw status --raw
      become: false
      register: bw_status
      changed_when: false
      no_log: true
      failed_when: bw_status.rc != 0 or ((bw_status.stdout | from_json).status | default('unauthenticated')) == 'unauthenticated'

    - name: Desbloquear vault y obtener sesión de Bitwarden
      command: bw unlock --passwordenv BW_PASSWORD --raw
      environment:
        BW_PASSWORD: "{{ bw_password }}"
      register: bw_unlock
      no_log: true
      become: false

    - name: Guardar BW_SESSION como fact
      set_fact:
        bw_session: "{{ bw_unlock.stdout }}"
      no_log: true

    - name: Sincronizar vault
      command: bw sync
      become: false
      environment:
        BW_SESSION: "{{ bw_session }}"
      changed_when: false
      no_log: true

    - name: Retirar restos del permiso temporal de pacman anterior
      become: true
      file:
        path: /etc/sudoers.d/pacman-nopasswd
        state: absent

    - name: Retirar restos del permiso temporal de pacman
      become: true
      file:
        path: /etc/sudoers.d/zz-pacman-nopasswd
        state: absent

    - name: Permitir sudo sin contraseña para pacman (necesario para AUR/paru)
      become: true
      copy:
        dest: /etc/sudoers.d/zz-pacman-nopasswd
        content: "{{ desktop_user }} ALL=(root) NOPASSWD: /usr/bin/pacman\n"
        mode: "0440"
        validate: "visudo -cf %s"
      notify: Remove temporary pacman sudoers

    - name: Verificar acceso no interactivo a pacman
      become: false
      command: sudo -n /usr/bin/pacman --version
      register: pacman_sudo_check
      changed_when: false
      failed_when: pacman_sudo_check.rc != 0

  roles:
    - packages
    - dev_tools
    - fonts
    - theme
    - extensions
    - zen
    - chezmoi

  handlers:
    - name: Remove temporary pacman sudoers
      become: true
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/sudoers.d/pacman-nopasswd
        - /etc/sudoers.d/zz-pacman-nopasswd
