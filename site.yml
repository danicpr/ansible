---
- hosts: localhost
  become: true
  vars:
    desktop_user: "{{ lookup('env', 'SUDO_USER') | default(lookup('env', 'USER'), true) }}"
    desktop_home: "{{ lookup('env', 'HOME') }}"
    enable_gnome: "{{ enable_gnome | default(false) | bool }}"
    enable_intel: "{{ enable_intel | default(false) | bool }}"
    enable_bitwarden: "{{ enable_bitwarden | default(false) | bool }}"
    bw_password: "{{ bw_password | default('') }}"
  vars_prompt:
    - name: git_name
      prompt: "Nombre para gitconfig"
      default: "Daniel Borre"
    - name: git_email
      prompt: "Correo para gitconfig"
      default: "dborrecaro@gmail.com"

  pre_tasks:
    - name: Validar usuario y home de escritorio
      become: false
      assert:
        that:
          - desktop_user | length > 0
          - desktop_home | length > 0
          - desktop_user != 'root'
          - desktop_home != '/root'
        fail_msg: "El playbook debe ejecutarse como el usuario de escritorio, no como root"
      tags: [always]

    - name: Comprobar instalación de Bitwarden CLI
      command: bw --version
      become: false
      changed_when: false
      when: enable_bitwarden | bool
      tags: [always, bitwarden, secrets]

    - name: Comprobar autenticación de Bitwarden
      command: bw status --raw
      become: false
      register: bw_status
      changed_when: false
      no_log: true
      failed_when: bw_status.rc != 0 or ((bw_status.stdout | from_json).status | default('unauthenticated')) == 'unauthenticated'
      when: enable_bitwarden | bool
      tags: [always, bitwarden, secrets]

    - name: Desbloquear vault y obtener sesión de Bitwarden
      command: bw unlock --passwordenv BW_PASSWORD --raw
      environment:
        BW_PASSWORD: "{{ bw_password }}"
      register: bw_unlock
      no_log: true
      become: false
      when: enable_bitwarden | bool and (bw_password | length > 0)
      tags: [always, bitwarden, secrets]

    - name: Guardar BW_SESSION como fact
      set_fact:
        bw_session: "{{ bw_unlock.stdout | default(lookup('env', 'BW_SESSION'), true) }}"
      no_log: true
      when: enable_bitwarden | bool
      tags: [always, bitwarden, secrets]

    - name: Sincronizar vault
      command: bw sync
      become: false
      environment:
        BW_SESSION: "{{ bw_session | default('') }}"
      changed_when: false
      no_log: true
      when: enable_bitwarden | bool and (bw_session | default('') | length > 0)
      tags: [always, bitwarden, secrets]

  tasks:
    - name: Configurar sudo temporal y ejecutar roles
      block:
        - name: Retirar restos del permiso temporal de pacman
          become: true
          file:
            path: /etc/sudoers.d/pacman-nopasswd
            state: absent
          tags: [always]

        - name: Permitir sudo sin contraseña para pacman (necesario para AUR/paru)
          become: true
          copy:
            dest: /etc/sudoers.d/pacman-nopasswd
            content: "{{ desktop_user }} ALL=(ALL) NOPASSWD: /usr/bin/pacman\n"
            mode: "0440"
            validate: "visudo -cf %s"
          tags: [always]

        - name: Verificar acceso no interactivo a pacman
          become: false
          command: sudo -k -n /usr/bin/pacman --version
          register: pacman_sudo_check
          changed_when: false
          failed_when: pacman_sudo_check.rc != 0
          tags: [always]

        - name: Aplicar role packages
          include_role:
            name: packages
          tags: [packages, base]

        - name: Aplicar role dev_tools
          include_role:
            name: dev_tools
          tags: [dev_tools, dev, base]

        - name: Aplicar role fonts
          include_role:
            name: fonts
          tags: [fonts, base]

        - name: Aplicar role theme
          include_role:
            name: theme
          tags: [theme, base]

        - name: Aplicar role extensions (Solo GNOME)
          include_role:
            name: extensions
          when: enable_gnome | bool
          tags: [gnome, extensions]

        - name: Aplicar role zen
          include_role:
            name: zen
          tags: [zen, base]

        - name: Aplicar role chezmoi
          include_role:
            name: chezmoi
          tags: [chezmoi, dotfiles, base, bitwarden, secrets]
      always:
        - name: Remove temporary pacman sudoers
          become: true
          file:
            path: /etc/sudoers.d/pacman-nopasswd
            state: absent
          tags: [always]
