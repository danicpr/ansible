---
- name: Configurar KDE Plasma estilo macOS Tahoe
  hosts: localhost
  connection: local

  vars:
    aur_user: "{{ ansible_facts['env']['USER'] }}"
    repos_dir: "{{ ansible_facts['env']['HOME'] }}/repos"

  handlers:
    - name: Actualizar FancyTasksNG
      ansible.builtin.command:
        cmd: make update
        chdir: "{{ repos_dir }}/FancyTasksNG"

  tasks:
    - name: Permitir ejecuciones temporales de pacman sin contraseña
      ansible.builtin.copy:
        dest: /etc/sudoers.d/pacman-nopasswd
        content: "{{ aur_user }} ALL=(ALL) NOPASSWD: /usr/bin/pacman\n"
        mode: "0440"
        validate: "visudo -cf %s"
      become: true

    - name: Instalar dependencias de compilación y herramientas de KDE
      community.general.pacman:
        name:
          - git
          - cmake
          - extra-cmake-modules
          - plasma-desktop
          - kvantum
          - kvantum-qt5
          - qt5ct
          - qt6ct
          - wayland
        state: present
      become: true

    - name: Instalar paquetes desde AUR
      kewlfft.aur.aur:
        name:
          - ulauncher
          - plasma6-applets-panel-colorizer
        state: present
        use: paru
      become: false

    - name: Crear directorio de repositorios
      ansible.builtin.file:
        path: "{{ repos_dir }}"
        state: directory
        mode: "0755"

    # Instalación/Actualización de FancyTasksNG
    - name: Clonar o actualizar FancyTasksNG
      ansible.builtin.git:
        repo: https://github.com/daydve/FancyTasksNG.git
        dest: "{{ repos_dir }}/FancyTasksNG"
        update: yes
      register: fancytasks_repo
      notify: Actualizar FancyTasksNG

    - name: Compilar e instalar FancyTasksNG por primera vez
      ansible.builtin.command:
        cmd: make install
        chdir: "{{ repos_dir }}/FancyTasksNG"
      when: fancytasks_repo.changed and not fancytasks_repo.before

    # Repositorios Temáticos Base (Vinceliuice)
    - name: Clonar MacTahoe-icon-theme
      ansible.builtin.git:
        repo: https://github.com/vinceliuice/MacTahoe-icon-theme.git
        dest: "{{ repos_dir }}/MacTahoe-icon-theme"

    - name: Ejecutar script de instalación del tema de iconos
      ansible.builtin.command:
        cmd: ./install.sh -b
        chdir: "{{ repos_dir }}/MacTahoe-icon-theme"

    - name: Clonar MacTahoe-gtk-theme
      ansible.builtin.git:
        repo: https://github.com/vinceliuice/MacTahoe-gtk-theme.git
        dest: "{{ repos_dir }}/MacTahoe-gtk-theme"

    - name: Ejecutar script de instalación del tema GTK
      ansible.builtin.command:
        cmd: ./install.sh -b
        chdir: "{{ repos_dir }}/MacTahoe-gtk-theme"

    - name: Clonar MacTahoe-kde
      ansible.builtin.git:
        repo: https://github.com/vinceliuice/MacTahoe-kde.git
        dest: "{{ repos_dir }}/MacTahoe-kde"

    - name: Ejecutar script de instalación del tema de KDE
      ansible.builtin.command:
        cmd: ./install.sh
        chdir: "{{ repos_dir }}/MacTahoe-kde"

    # Efectos de Ventana y Renderizado
    - name: Clonar KDE-Rounded-Corners
      ansible.builtin.git:
        repo: https://github.com/matinlotfali/KDE-Rounded-Corners.git
        dest: "{{ repos_dir }}/KDE-Rounded-Corners"

    - name: Compilar e instalar KDE-Rounded-Corners
      ansible.builtin.shell:
        cmd: |
          mkdir -p build && cd build
          cmake .. -DCMAKE_INSTALL_PREFIX=/usr
          make
          make install
        chdir: "{{ repos_dir }}/KDE-Rounded-Corners"
      become: true

    - name: Clonar kwin-effects-better-blur-dx
      ansible.builtin.git:
        repo: https://github.com/xarblu/kwin-effects-better-blur-dx.git
        dest: "{{ repos_dir }}/kwin-effects-better-blur-dx"

    - name: Compilar e instalar kwin-effects-better-blur-dx
      ansible.builtin.shell:
        cmd: |
          mkdir -p build && cd build
          cmake .. -DCMAKE_INSTALL_PREFIX=/usr
          make
          make install
        chdir: "{{ repos_dir }}/kwin-effects-better-blur-dx"
      become: true

    # Widgets & Applets
    - name: Clonar liquidglass-kde-widgets
      ansible.builtin.git:
        repo: https://github.com/jaxparrow07/liquidglass-kde-widgets.git
        dest: "{{ repos_dir }}/liquidglass-kde-widgets"

    - name: Clonar ulauncher-liquid-glass
      ansible.builtin.git:
        repo: https://github.com/kayozxo/ulauncher-liquid-glass.git
        dest: "{{ repos_dir }}/ulauncher-liquid-glass"

    - name: Instalar tema Liquid Glass en Ulauncher
      ansible.builtin.file:
        src: "{{ repos_dir }}/ulauncher-liquid-glass"
        dest: "{{ ansible_facts['env']['HOME'] }}/.config/ulauncher/user-themes/liquid-glass"
        state: link

    - name: Clonar TahoeLauncher
      ansible.builtin.git:
        repo: https://github.com/EliverLara/TahoeLauncher.git
        dest: "{{ repos_dir }}/TahoeLauncher"

    - name: Limpiar el archivo de sudoers de pacman
      ansible.builtin.file:
        path: /etc/sudoers.d/pacman-nopasswd
        state: absent
      become: true
