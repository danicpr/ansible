---
- name: Inicializar toolchain de Rust (stable)
  become: false
  command: rustup default stable
  args:
    creates: "{{ desktop_home }}/.rustup/toolchains"

- name: Instalar omp vía script oficial
  become: false
  ansible.builtin.shell: curl -fsSL https://omp.sh/install | sh
  environment:
    HOME: "{{ desktop_home }}"
  args:
    creates: "{{ desktop_home }}/.local/bin/omp"
- name: Instalar fnm vía Cargo
  become: false
  command: cargo install fnm
  environment:
    PATH: "{{ desktop_home }}/.cargo/bin:{{ lookup('env', 'PATH') }}"
  args:
    creates: "{{ desktop_home }}/.cargo/bin/fnm"

- name: Instalar Node, establecer versión por defecto y activar pnpm
  become: false
  ansible.builtin.shell: |
    export PATH="{{ desktop_home }}/.cargo/bin:$PATH"
    eval "$(fnm env --use-on-cd --shell bash)"
    fnm install --latest
    fnm default latest
    fnm use latest
    npm install -g corepack
    corepack enable pnpm
  args:
    executable: /bin/bash
  changed_when: false

- name: Instalar silicon vía Cargo
  become: false
  command: cargo install silicon
  environment:
    PATH: "{{ desktop_home }}/.cargo/bin:{{ lookup('env', 'PATH') }}"
  args:
    creates: "{{ desktop_home }}/.cargo/bin/silicon"

- name: Instalar SDKMAN
  become: false
  ansible.builtin.shell: curl -s "https://get.sdkman.io?rcupdate=false" | zsh
  args:
    creates: "{{ desktop_home }}/.sdkman/bin/sdkman-init.sh"

- name: Instalar versión por defecto de Java vía SDKMAN
  become: false
  ansible.builtin.shell: |
    export SDKMAN_DIR="{{ desktop_home }}/.sdkman"
    sed -i 's/sdkman_auto_answer=false/sdkman_auto_answer=true/' "${SDKMAN_DIR}/etc/config" || true
    source "${SDKMAN_DIR}/bin/sdkman-init.sh"
    sdk install java
  args:
    executable: /bin/bash
    creates: "{{ desktop_home }}/.sdkman/candidates/java/current/bin/java"

- name: Crear enlace simbólico de Java al PATH
  become: true
  ansible.builtin.file:
    src: "{{ desktop_home }}/.sdkman/candidates/java/current/bin/java"
    dest: /usr/bin/java
    state: link
    force: true
