- name: Compilar e instalar paquetes dummy si no existen
  ansible.builtin.shell: |
    if ! pacman -Qi {{ item }} > /dev/null 2>&1; then
      cd /tmp/pkg-dummies/{{ item }}
      makepkg -si --noconfirm --needed
    fi
  loop:
    - dummy-nodejs
    - java-dummy
  become: false
  changed_when: false

- name: Limpiar archivos temporales de compilación
  ansible.builtin.file:
    path: /tmp/pkg-dummies
    state: absent

- name: Instalar paquetes de repos oficiales
  pacman:
    name: "{{ pacman_packages + (gnome_pacman_packages if (enable_gnome | default(false) | bool) else []) + (intel_pacman_packages if (enable_intel | default(false) | bool) else []) }}"
    state: present

- name: Habilitar e iniciar servicio Docker
  systemd:
    name: docker
    enabled: true
    state: started
  when: "'docker' in pacman_packages"

- name: Añadir usuario al grupo docker
  user:
    name: "{{ desktop_user }}"
    groups: docker
    append: true
  when: "'docker' in pacman_packages"
- name: Definir lista combinada de paquetes AUR
  set_fact:
    final_aur_packages: "{{ aur_packages + (gnome_aur_packages if (enable_gnome | default(false) | bool) else []) }}"

- name: Instalar paquetes de AUR
  become: false
  command: paru --pacman /usr/bin/pacman -S --noconfirm --needed {{ final_aur_packages | join(' ') }}
  register: aur_install
  changed_when: "'there is nothing to do' not in ((aur_install.stdout ~ aur_install.stderr) | lower)"
  when: final_aur_packages | length > 0

- name: Añadir repositorio Flathub
  community.general.flatpak_remote:
    name: flathub
    state: present
    flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
    method: system
  when: flatpak_packages is defined and flatpak_packages | length > 0

- name: Añadir repositorio Gnome nightly
  community.general.flatpak_remote:
    name: gnome-nightly
    state: present
    flatpakrepo_url: https://nightly.gnome.org/gnome-nightly.flatpakrepo
    method: system
  when: (enable_gnome | default(false) | bool) and (gnome_nightly_packages is defined and gnome_nightly_packages | length > 0)

- name: Instalar paquetes Flatpak (Flathub)
  community.general.flatpak:
    name: "{{ flatpak_packages }}"
    state: present
    remote: flathub
    method: system
  when: flatpak_packages is defined and flatpak_packages | length > 0

- name: Instalar paquetes Flatpak (Gnome Nightly)
  community.general.flatpak:
    name: "{{ gnome_nightly_packages }}"
    state: present
    remote: gnome-nightly
    method: system
  when: (enable_gnome | default(false) | bool) and (gnome_nightly_packages is defined and gnome_nightly_packages | length > 0)
