---
- name: Determinar si el usuario es Daniel Borre
  ansible.builtin.set_fact:
    is_daniel_borre: "{{ (git_name | default('') == 'Daniel Borre') or ((git_name | default('') | length == 0) and (lookup('pipe', 'git config --get user.name 2>/dev/null || true') | trim == 'Daniel Borre')) }}"

- name: Asegurar directorio .ssh del usuario
  ansible.builtin.file:
    path: "{{ desktop_home }}/.ssh"
    state: directory
    owner: "{{ desktop_user }}"
    group: "{{ desktop_user }}"
    mode: "0700"
  become: false

- name: Buscar item de clave SSH vibe en Bitwarden
  ansible.builtin.command: bw list items --search vibe --raw
  environment:
    BW_SESSION: "{{ bw_session | default(lookup('env', 'BW_SESSION', default=''), true) }}"
    PATH: "{{ desktop_home }}/.local/bin:{{ desktop_home }}/.bun/bin:{{ desktop_home }}/.cargo/bin:{{ ansible_env.PATH }}"
  register: bw_vibe_items_raw
  become: false
  changed_when: false
  failed_when: false
  when:
    - (bw_session | default(lookup('env', 'BW_SESSION', default=''), true) | length > 0)

- name: Extraer y guardar clave SSH privada desde Bitwarden
  ansible.builtin.copy:
    dest: "{{ desktop_home }}/.ssh/id_github_vibe"
    content: |
      {% set raw_parsed = bw_vibe_items_raw.stdout | from_json %}
      {% set items = raw_parsed if (raw_parsed is iterable and raw_parsed is not mapping) else [raw_parsed] %}
      {% set found_key = namespace(val='') %}
      {% for it in items if it is mapping %}
        {% if not found_key.val %}
          {% if 'sshKey' in it and it.sshKey is mapping and 'privateKey' in it.sshKey and it.sshKey.privateKey %}
            {% set found_key.val = it.sshKey.privateKey %}
          {% elif 'notes' in it and it.notes is string and 'PRIVATE KEY' in it.notes %}
            {% set found_key.val = it.notes %}
          {% elif 'login' in it and it.login is mapping and 'password' in it.login and it.login.password is string and 'PRIVATE KEY' in it.login.password %}
            {% set found_key.val = it.login.password %}
          {% elif 'fields' in it and it.fields is iterable %}
            {% for f in it.fields if f is mapping and 'PRIVATE KEY' in (f.value | default('')) %}
              {% set found_key.val = f.value %}
            {% endfor %}
          {% endif %}
        {% endif %}
      {% endfor %}
      {{ found_key.val | trim }}
    owner: "{{ desktop_user }}"
    group: "{{ desktop_user }}"
    mode: "0600"
  become: false
  when:
    - bw_vibe_items_raw is defined
    - bw_vibe_items_raw.rc == 0
    - (bw_vibe_items_raw.stdout | default('') | length > 0)
    - "'PRIVATE KEY' in bw_vibe_items_raw.stdout"

- name: Extraer y guardar clave SSH publica desde Bitwarden
  ansible.builtin.copy:
    dest: "{{ desktop_home }}/.ssh/id_github_vibe.pub"
    content: |
      {% set raw_parsed = bw_vibe_items_raw.stdout | from_json %}
      {% set items = raw_parsed if (raw_parsed is iterable and raw_parsed is not mapping) else [raw_parsed] %}
      {% set found_pub = namespace(val='') %}
      {% for it in items if it is mapping %}
        {% if not found_pub.val and 'sshKey' in it and it.sshKey is mapping and 'publicKey' in it.sshKey and it.sshKey.publicKey %}
          {% set found_pub.val = it.sshKey.publicKey %}
        {% endif %}
      {% endfor %}
      {{ found_pub.val | trim }}
    owner: "{{ desktop_user }}"
    group: "{{ desktop_user }}"
    mode: "0644"
  become: false
  when:
    - bw_vibe_items_raw is defined
    - bw_vibe_items_raw.rc == 0
    - (bw_vibe_items_raw.stdout | default('') | length > 0)
    - "'publicKey' in bw_vibe_items_raw.stdout"

- name: Comprobar existencia de clave SSH de vibe
  ansible.builtin.stat:
    path: "{{ desktop_home }}/.ssh/id_github_vibe"
  register: ssh_key_vibe
  become: false

- name: Asegurar permisos de la clave SSH de vibe si existe
  ansible.builtin.file:
    path: "{{ desktop_home }}/.ssh/id_github_vibe"
    owner: "{{ desktop_user }}"
    group: "{{ desktop_user }}"
    mode: "0600"
  become: false
  when: ssh_key_vibe.stat.exists

- name: Instalar chezmoi
  ansible.builtin.shell: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "{{ desktop_home }}/.local/bin"
  args:
    creates: "{{ desktop_home }}/.local/bin/chezmoi"
  become: false

- name: Comprobar si existe el source repo de chezmoi
  ansible.builtin.stat:
    path: "{{ desktop_home }}/.local/share/chezmoi/.git"
  register: chezmoi_source_repo
  become: false

- name: Inicializar y aplicar source nuevo de chezmoi vía HTTPS
  ansible.builtin.command: "{{ desktop_home }}/.local/bin/chezmoi init --apply --force https://github.com/danicpr/dotfiles.git"
  become: false
  environment:
    HOME: "{{ desktop_home }}"
    BW_SESSION: "{{ bw_session | default(lookup('env', 'BW_SESSION', default=''), true) }}"
    GIT_NAME: "{{ git_name | default('Daniel Borre') }}"
    GIT_EMAIL: "{{ git_email | default('dborrecaro@gmail.com') }}"
  when: not chezmoi_source_repo.stat.exists

- name: Comprobar si existe la configuracion de chezmoi
  ansible.builtin.stat:
    path: "{{ desktop_home }}/.config/chezmoi/chezmoi.toml"
  register: chezmoi_config_file
  become: false

- name: Inicializar configuracion de chezmoi si no existe
  ansible.builtin.command: "{{ desktop_home }}/.local/bin/chezmoi init --force"
  become: false
  environment:
    HOME: "{{ desktop_home }}"
    BW_SESSION: "{{ bw_session | default(lookup('env', 'BW_SESSION', default=''), true) }}"
    GIT_NAME: "{{ git_name | default('Daniel Borre') }}"
    GIT_EMAIL: "{{ git_email | default('dborrecaro@gmail.com') }}"
  when: not chezmoi_config_file.stat.exists

- name: Aplicar source existente de chezmoi
  ansible.builtin.command: "{{ desktop_home }}/.local/bin/chezmoi apply --force"
  become: false
  environment:
    HOME: "{{ desktop_home }}"
    BW_SESSION: "{{ bw_session | default(lookup('env', 'BW_SESSION', default=''), true) }}"
    GIT_NAME: "{{ git_name | default('Daniel Borre') }}"
    GIT_EMAIL: "{{ git_email | default('dborrecaro@gmail.com') }}"
  when: chezmoi_source_repo.stat.exists

- name: Comprobar remote del source repo de chezmoi
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ desktop_home }}/.local/share/chezmoi"
      - remote
      - get-url
      - origin
  register: chezmoi_remote
  become: false
  changed_when: false
  failed_when: false
  when:
    - is_daniel_borre | bool
    - ssh_key_vibe.stat.exists

- name: Actualizar remote del source repo de chezmoi a github-vibe si la clave SSH existe
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ desktop_home }}/.local/share/chezmoi"
      - remote
      - set-url
      - origin
      - "git@github-vibe:danicpr/dotfiles.git"
  become: false
  when:
    - is_daniel_borre | bool
    - ssh_key_vibe.stat.exists
    - (chezmoi_remote.stdout | default('') | trim != 'git@github-vibe:danicpr/dotfiles.git')

- name: Comprobar si el directorio ansible es un repositorio git
  ansible.builtin.stat:
    path: "{{ desktop_home }}/ansible/.git"
  register: ansible_git_repo
  become: false

- name: Configurar remote de ansible a github-vibe si la clave SSH existe
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ desktop_home }}/ansible"
      - remote
      - set-url
      - origin
      - "git@github-vibe:danicpr/ansible.git"
  become: false
  when:
    - is_daniel_borre | bool
    - ssh_key_vibe.stat.exists
    - ansible_git_repo.stat.exists
