---
- name: Determinar si el usuario es Daniel Borre
  ansible.builtin.set_fact:
    is_daniel_borre: "{{ (git_name | default('') == 'Daniel Borre') or ((git_name | default('') | length == 0) and (lookup('pipe', 'git config --get user.name 2>/dev/null || true') | trim == 'Daniel Borre')) }}"

- name: Asegurar directorio .ssh del usuario
  ansible.builtin.file:
    path: "{{ desktop_home }}/.ssh"
    state: directory
    owner: "{{ desktop_user }}"
    group: "{{ desktop_user }}"
    mode: "0700"
  become: false

- name: Obtener clave SSH github_vibe desde Bitwarden
  ansible.builtin.shell: |
    export BW_SESSION="{{ bw_session }}"
    python3 -c "
import json, subprocess, sys
try:
    res = subprocess.run(['bw', 'get', 'item', 'github_vibe', '--raw'], capture_output=True, text=True, check=True)
    item = json.loads(res.stdout)
    key = ''
    if 'sshKey' in item and isinstance(item['sshKey'], dict) and item['sshKey'].get('privateKey'):
        key = item['sshKey']['privateKey']
    elif item.get('notes') and 'PRIVATE KEY' in item['notes']:
        key = item['notes']
    elif item.get('login', {}).get('password') and 'PRIVATE KEY' in item['login']['password']:
        key = item['login']['password']
    else:
        for f in item.get('fields', []):
            if 'PRIVATE KEY' in f.get('value', ''):
                key = f['value']
                break
        if not key and item.get('notes'):
            key = item['notes']
    if key:
        key = key.strip() + '\n'
        with open('{{ desktop_home }}/.ssh/id_github_vibe', 'w') as f:
            f.write(key)
        print('KEY_SAVED')
    else:
        print('KEY_NOT_FOUND', file=sys.stderr)
except Exception as e:
    print(f'ERROR: {e}', file=sys.stderr)
    sys.exit(1)
"
  args:
    executable: /bin/bash
  register: bw_ssh_key_result
  become: false
  no_log: true
  changed_when: "'KEY_SAVED' in bw_ssh_key_result.stdout"
  failed_when: false
  when:
    - is_daniel_borre | bool
    - bw_session | default('') | length > 0

- name: Comprobar existencia de clave SSH de vibe
  ansible.builtin.stat:
    path: "{{ desktop_home }}/.ssh/id_github_vibe"
  register: ssh_key_vibe
  become: false

- name: Asegurar permisos de la clave SSH de vibe si existe
  ansible.builtin.file:
    path: "{{ desktop_home }}/.ssh/id_github_vibe"
    owner: "{{ desktop_user }}"
    group: "{{ desktop_user }}"
    mode: "0600"
  become: false
  when: ssh_key_vibe.stat.exists

- name: Configurar host github-vibe en ~/.ssh/config
  ansible.builtin.blockinfile:
    path: "{{ desktop_home }}/.ssh/config"
    create: true
    owner: "{{ desktop_user }}"
    group: "{{ desktop_user }}"
    mode: "0600"
    marker: "# {mark} ANSIBLE MANAGED BLOCK (github-vibe)"
    block: |
      Host github-vibe
        HostName github.com
        User git
        IdentityFile ~/.ssh/id_github_vibe
  become: false
  when: is_daniel_borre | bool

- name: Instalar chezmoi
  ansible.builtin.shell: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "{{ desktop_home }}/.local/bin"
  args:
    creates: "{{ desktop_home }}/.local/bin/chezmoi"
  become: false

- name: Comprobar si existe el source repo de chezmoi
  ansible.builtin.stat:
    path: "{{ desktop_home }}/.local/share/chezmoi/.git"
  register: chezmoi_source_repo
  become: false

- name: Establecer URL del repositorio de dotfiles
  ansible.builtin.set_fact:
    chezmoi_repo_url: "{{ 'git@github-vibe:danicpr/dotfiles.git' if (is_daniel_borre | bool) else 'https://github.com/danicpr/dotfiles.git' }}"

- name: Inicializar y aplicar source nuevo de chezmoi
  ansible.builtin.command: "{{ desktop_home }}/.local/bin/chezmoi init --apply {{ chezmoi_repo_url }}"
  become: false
  environment:
    HOME: "{{ desktop_home }}"
    BW_SESSION: "{{ bw_session | default('') }}"
    GIT_NAME: "{{ git_name | default('') }}"
    GIT_EMAIL: "{{ git_email | default('') }}"
  no_log: true
  when: not chezmoi_source_repo.stat.exists

- name: Comprobar remote del source repo de chezmoi
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ desktop_home }}/.local/share/chezmoi"
      - remote
      - get-url
      - origin
  register: chezmoi_remote
  become: false
  changed_when: false
  failed_when: false
  when: chezmoi_source_repo.stat.exists

- name: Actualizar remote del source repo de chezmoi a github-vibe si difiere
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ desktop_home }}/.local/share/chezmoi"
      - remote
      - set-url
      - origin
      - "{{ chezmoi_repo_url }}"
  become: false
  when: chezmoi_source_repo.stat.exists and (chezmoi_remote.stdout | default('') | trim != chezmoi_repo_url)

- name: Aplicar source existente de chezmoi
  ansible.builtin.command: "{{ desktop_home }}/.local/bin/chezmoi apply --force"
  become: false
  environment:
    HOME: "{{ desktop_home }}"
    BW_SESSION: "{{ bw_session | default('') }}"
    GIT_NAME: "{{ git_name | default('') }}"
    GIT_EMAIL: "{{ git_email | default('') }}"
  no_log: true
  when: chezmoi_source_repo.stat.exists

- name: Comprobar si el directorio ansible es un repositorio git
  ansible.builtin.stat:
    path: "{{ desktop_home }}/ansible/.git"
  register: ansible_git_repo
  become: false

- name: Configurar remote de ansible a github-vibe
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ desktop_home }}/ansible"
      - remote
      - set-url
      - origin
      - "git@github-vibe:danicpr/ansible.git"
  become: false
  when:
    - is_daniel_borre | bool
    - ansible_git_repo.stat.exists
