---
- name: Instalar gnome-extensions-cli vía pipx
  become: false
  command: pipx install gnome-extensions-cli
  args:
    creates: "{{ desktop_home }}/.local/bin/gext"

- name: Comprobar sesión D-Bus y extensiones instaladas
  command: gnome-extensions list
  register: gnome_extensions_installed
  changed_when: false
  become: false

- name: Instalar extensiones de GNOME Shell (vía gext)
  command: "{{ desktop_home }}/.local/bin/gext install {{ item }}"
  loop: "{{ gnome_extensions }}"
  when: item not in gnome_extensions_installed.stdout_lines
  become: false

# --- SearchlightNG: instalación manual, aún no está en extensions.gnome.org ---

- name: Verificar si SearchlightNG ya está instalada
  stat:
    path: "{{ desktop_home }}/.local/share/gnome-shell/extensions/search-light-ng@salix.host"
  register: searchlight_installed
  become: false

- name: Clonar repo de SearchlightNG
  become: false
  git:
    repo: https://git.salix.host/salix/searchlightng.git
    dest: /tmp/searchlightng
    depth: 1
  when: not searchlight_installed.stat.exists

- name: Compilar e instalar SearchlightNG
  become: false
  command: make build install
  args:
    chdir: /tmp/searchlightng
  when: not searchlight_installed.stat.exists

# --- Habilitar todas juntas al final ---

- name: Obtener lista de extensiones habilitadas
  command: gnome-extensions list --enabled
  register: gnome_extensions_enabled
  changed_when: false
  become: false

- name: Habilitar todas las extensiones
  command: "{{ desktop_home }}/.local/bin/gext enable {{ item }}"
  loop: "{{ gnome_extensions + ['search-light-ng@salix.host'] }}"
  when: item not in gnome_extensions_enabled.stdout_lines
  become: false
